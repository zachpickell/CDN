# Self-hosted Qdrant for the RAG search. Run alongside the app on falc:
#   docker compose -f docker-compose.rag.yml up -d
#
# Data persists in the named volume. Bind it to localhost only; reach it
# remotely over Tailscale rather than exposing 6333 to the LAN/internet.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cdn-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST (used by the app)
      - "127.0.0.1:6334:6334"   # gRPC (optional)
    volumes:
      - qdrant_data:/qdrant/storage
    # Uncomment to require an API key (then set QDRANT_API_KEY in .env.local):
    # environment:
    #   QDRANT__SERVICE__API_KEY: "change-me-to-a-long-random-string"

volumes:
  qdrant_data:
